<tr><td style="padding:0 0 16px;"><table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#ffffff" style="border-collapse:separate;background-color:#ffffff;background-image:url(https://bharatquantumprospera.com/email/2026-11/founders01/bg-white.png);background-repeat:repeat;border:1px solid #e4e7ea;border-radius:18px;"><tr><td align="center" bgcolor="#ffffff" style="padding:24px 3% 6px;font-size:0;line-height:0;text-align:center;background-color:#ffffff;background-image:url(https://bharatquantumprospera.com/email/2026-11/founders01/bg-white.png);background-repeat:repeat;border-radius:18px;"><!--[if mso]><table role="presentation" width="1024" cellpadding="0" cellspacing="0" border="0"><tr><td width="500" valign="top"><![endif]--><div class="col" style="display:inline-block;vertical-align:top;width:100%;max-width:500px;text-align:left;"><table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#ffffff" style="border-collapse:collapse;background-color:#ffffff;background-image:url(https://bharatquantumprospera.com/email/2026-11/founders01/bg-white.png);background-repeat:repeat;"><tr><td style="font-size:0;line-height:0;"><img src="https://bharatquantumprospera.com/email/2026-11/founders01/003.png" width="442" alt="If you’re an Indian founder with a US company that owns your Indian startup, please read this before your next fundraise." style="width:100%;height:auto;display:block;border:0;"></td></tr><tr><td style="font-size:0;line-height:0;"><a href="https://bharatquantumprospera.com/triangular-structure-indian-founders-us-parent-indian-subsidiary-odi-schedule-iii-2026.html?utm_source=newsletter&amp;utm_medium=email&amp;utm_campaign=bqp_founders_01&amp;utm_content=gif_hero" target="_blank" style="display:block;"><img src="https://bharatquantumprospera.com/email/2026-11/founders01/004.gif" width="442" alt="The founder triangle: founders living in India own a Delaware parent (ODI), which owns the Indian company (FDI). Where founders hold 10% or more, FEMA Schedule III means approval is needed." style="width:100%;height:auto;display:block;border:0;"></a></td></tr><tr><td style="font-size:0;line-height:0;"><img src="https://bharatquantumprospera.com/email/2026-11/founders01/005.png" width="442" alt="" style="width:100%;height:auto;display:block;border:0;"></td></tr></table></div><!--[if mso]></td><td width="24"></td><td width="500" valign="top"><![endif]--><div style="display:inline-block;width:24px;height:1px;font-size:0;line-height:0;">&nbsp;</div><div class="col" style="display:inline-block;vertical-align:top;width:100%;max-width:500px;text-align:left;"><table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#ffffff" style="border-collapse:collapse;background-color:#ffffff;background-image:url(https://bharatquantumprospera.com/email/2026-11/founders01/bg-white.png);background-repeat:repeat;"><tr><td style="font-size:0;line-height:0;"><img src="https://bharatquantumprospera.com/email/2026-11/founders01/006.png" width="442" alt="FOUNDERS SPECIAL Almost every Indian startup that raises from US investors ends up in the same shape: the founders live in India, a Delaware company sits on top, and the Indian company that actually employs the team sits underneath. It works. But one rule in India’s overseas investment law catches most founder-controlled versions of it, and many founders only hear about it when an investor’s lawyer asks. Five minutes now. A cleaner round later." style="width:100%;height:auto;display:block;border:0;"></td></tr></table></div><!--[if mso]></td></tr></table><![endif]--></td></tr></table></td></tr>
<tr><td style="padding:0 0 16px;"><table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#ffffff" style="border-collapse:separate;background-color:#ffffff;background-image:url(https://bharatquantumprospera.com/email/2026-11/founders01/bg-white.png);background-repeat:repeat;border:1px solid #e4e7ea;border-radius:18px;"><tr><td align="center" bgcolor="#ffffff" style="padding:24px 3% 6px;font-size:0;line-height:0;text-align:center;background-color:#ffffff;background-image:url(https://bharatquantumprospera.com/email/2026-11/founders01/bg-white.png);background-repeat:repeat;border-radius:18px;"><!--[if mso]><table role="presentation" width="1024" cellpadding="0" cellspacing="0" border="0"><tr><td width="500" valign="top"><![endif]--><div class="col" style="display:inline-block;vertical-align:top;width:100%;max-width:500px;text-align:left;"><table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#ffffff" style="border-collapse:collapse;background-color:#ffffff;background-image:url(https://bharatquantumprospera.com/email/2026-11/founders01/bg-white.png);background-repeat:repeat;"><tr><td style="font-size:0;line-height:0;"><img src="https://bharatquantumprospera.com/email/2026-11/founders01/007.png" width="442" alt="THE RULE Control the US parent from India, and FEMA expects approval. Under the Overseas Investment Rules, 2022, a resident individual can invest abroad under the general route only in an operating foreign company that has no subsidiary or step-down subsidiary where the individual has control. Control is a low bar: 10% or more of the votes, the right to appoint a majority of the board, or control of management or policy decisions. Most founders cross it on day one." style="width:100%;height:auto;display:block;border:0;"></td></tr></table></div><!--[if mso]></td><td width="24"></td><td width="500" valign="top"><![endif]--><div style="display:inline-block;width:24px;height:1px;font-size:0;line-height:0;">&nbsp;</div><div class="col" style="display:inline-block;vertical-align:top;width:100%;max-width:500px;text-align:left;"><table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#ffffff" style="border-collapse:collapse;background-color:#ffffff;background-image:url(https://bharatquantumprospera.com/email/2026-11/founders01/bg-white.png);background-repeat:repeat;"><tr><td style="font-size:0;line-height:0;"><img src="https://bharatquantumprospera.com/email/2026-11/founders01/008.png" width="442" alt="A founder-controlled Delaware parent that owns an Indian company therefore usually sits outside the automatic route. The fix is approval through the authorised dealer bank, ideally before the shares are issued or swapped. A second rule applies to everyone: the round-tripping limit. Money leaving India and coming back through a foreign company is allowed only up to two layers of subsidiaries. The structure isn’t banned. Skipping the paperwork is what hurts." style="width:100%;height:auto;display:block;border:0;"></td></tr><tr><td style="font-size:0;line-height:0;"><table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="table-layout:fixed;border-collapse:collapse;"><tr><td width="59.389%" valign="top" style="width:59.389%;font-size:0;line-height:0;"><a href="https://bharatquantumprospera.com/triangular-structure-indian-founders-us-parent-indian-subsidiary-odi-schedule-iii-2026.html?utm_source=newsletter&amp;utm_medium=email&amp;utm_campaign=bqp_founders_01&amp;utm_content=tri_inline" target="_blank" style="display:block;"><img src="https://bharatquantumprospera.com/email/2026-11/founders01/009.png" width="262" alt="The triangle, explained on our site →" style="width:100%;height:auto;display:block;border:0;"></a></td><td width="40.611%" valign="top" style="width:40.611%;font-size:0;line-height:0;"><img src="https://bharatquantumprospera.com/email/2026-11/founders01/010.png" width="180" alt="" style="width:100%;height:auto;display:block;border:0;"></td></tr></table></td></tr><tr><td style="font-size:0;line-height:0;"><img src="https://bharatquantumprospera.com/email/2026-11/founders01/011.png" width="442" alt="" style="width:100%;height:auto;display:block;border:0;"></td></tr></table></div><!--[if mso]></td></tr></table><![endif]--></td></tr></table></td></tr>
<tr><td style="padding:0 0 16px;"><table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#ffffff" style="border-collapse:separate;background-color:#ffffff;background-image:url(https://bharatquantumprospera.com/email/2026-11/founders01/bg-white.png);background-repeat:repeat;border:1px solid #e4e7ea;border-radius:18px;"><tr><td align="center" bgcolor="#ffffff" style="padding:24px 3% 6px;font-size:0;line-height:0;text-align:center;background-color:#ffffff;background-image:url(https://bharatquantumprospera.com/email/2026-11/founders01/bg-white.png);background-repeat:repeat;border-radius:18px;"><!--[if mso]><table role="presentation" width="1024" cellpadding="0" cellspacing="0" border="0"><tr><td width="500" valign="top"><![endif]--><div class="col" style="display:inline-block;vertical-align:top;width:100%;max-width:500px;text-align:left;"><table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#ffffff" style="border-collapse:collapse;background-color:#ffffff;background-image:url(https://bharatquantumprospera.com/email/2026-11/founders01/bg-white.png);background-repeat:repeat;"><tr><td style="font-size:0;line-height:0;"><img src="https://bharatquantumprospera.com/email/2026-11/founders01/012.png" width="442" alt="WHAT FOUNDERS ASK ME Eight questions I hear every week C-Corp or LLC? If you will raise from VCs or offer stock options, a Delaware C-Corp. An LLC suits a bootstrapped service business, and its pass-through tax can clash with Indian tax for residents. Can I incorporate online and run it from India? You can, but a company managed entirely from India can be treated as resident in India. Decide where the board really sits. Do I need RBI permission to own it? It is overseas direct investment: within your LRS limit, reported through your bank, with an annual performance report every 31 December." style="width:100%;height:auto;display:block;border:0;"></td></tr><tr><td style="font-size:0;line-height:0;"><img src="https://bharatquantumprospera.com/email/2026-11/founders01/013.png" width="442" alt="Is the flip tax-free? No. Swapping Indian shares for US shares is a transfer: Indian shareholders pay capital gains on fair value." style="width:100%;height:auto;display:block;border:0;"></td></tr></table></div><!--[if mso]></td><td width="24"></td><td width="500" valign="top"><![endif]--><div style="display:inline-block;width:24px;height:1px;font-size:0;line-height:0;">&nbsp;</div><div class="col" style="display:inline-block;vertical-align:top;width:100%;max-width:500px;text-align:left;"><table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#ffffff" style="border-collapse:collapse;background-color:#ffffff;background-image:url(https://bharatquantumprospera.com/email/2026-11/founders01/bg-white.png);background-repeat:repeat;"><tr><td style="font-size:0;line-height:0;"><img src="https://bharatquantumprospera.com/email/2026-11/founders01/014.png" width="442" alt="Does angel tax still bite? No. It does not apply to share issues from assessment year 2025-26. Do we file a BOI report? Not for a company formed in the US: FinCEN exempted them in March 2025. What does the US expect each year? A federal return with Form 5472 if a foreign person owns 25% or more (USD 25,000 penalty per missed form), plus Delaware franchise tax by 1 March. How should the Indian company charge the parent? Cost plus a margin, with transfer pricing papers. From 2026-27 a 15.5% safe harbour can settle it for five years." style="width:100%;height:auto;display:block;border:0;"></td></tr></table></div><!--[if mso]></td></tr></table><![endif]--></td></tr></table></td></tr>
<tr><td style="padding:0 0 16px;"><table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#ffffff" style="border-collapse:separate;background-color:#ffffff;background-image:url(https://bharatquantumprospera.com/email/2026-11/founders01/bg-white.png);background-repeat:repeat;border:1px solid #e4e7ea;border-radius:18px;"><tr><td align="center" bgcolor="#ffffff" style="padding:24px 3% 6px;font-size:0;line-height:0;text-align:center;background-color:#ffffff;background-image:url(https://bharatquantumprospera.com/email/2026-11/founders01/bg-white.png);background-repeat:repeat;border-radius:18px;"><!--[if mso]><table role="presentation" width="1024" cellpadding="0" cellspacing="0" border="0"><tr><td width="500" valign="top"><![endif]--><div class="col" style="display:inline-block;vertical-align:top;width:100%;max-width:500px;text-align:left;"><table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#ffffff" style="border-collapse:collapse;background-color:#ffffff;background-image:url(https://bharatquantumprospera.com/email/2026-11/founders01/bg-white.png);background-repeat:repeat;"><tr><td style="font-size:0;line-height:0;"><img src="https://bharatquantumprospera.com/email/2026-11/founders01/015.png" width="442" alt="MYTH VS FACT Four things I correct most often" style="width:100%;height:auto;display:block;border:0;"></td></tr><tr><td style="font-size:0;line-height:0;"><img src="https://bharatquantumprospera.com/email/2026-11/founders01/016.gif" width="442" alt="Myth vs fact: a Delaware company does not keep you outside Indian tax; owning it is ODI with RBI reporting; US-formed companies are exempt from BOI since March 2025; the flip share swap is taxable." style="width:100%;height:auto;display:block;border:0;"></td></tr><tr><td style="font-size:0;line-height:0;"><img src="https://bharatquantumprospera.com/email/2026-11/founders01/017.png" width="442" alt="" style="width:100%;height:auto;display:block;border:0;"></td></tr></table></div><!--[if mso]></td><td width="24"></td><td width="500" valign="top"><![endif]--><div style="display:inline-block;width:24px;height:1px;font-size:0;line-height:0;">&nbsp;</div><div class="col" style="display:inline-block;vertical-align:top;width:100%;max-width:500px;text-align:left;"><table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#ffffff" style="border-collapse:collapse;background-color:#ffffff;background-image:url(https://bharatquantumprospera.com/email/2026-11/founders01/bg-white.png);background-repeat:repeat;"><tr><td style="font-size:0;line-height:0;"><img src="https://bharatquantumprospera.com/email/2026-11/founders01/018.png" width="442" alt="None of these is exotic. They come up in nearly every founder call, usually after the company is already set up. The cheapest time to get them right is before the first share is issued. The most expensive is during a term sheet, when the investor’s counsel asks for your FEMA filings and there aren’t any. Diligence teams read FEMA filings. Make yours boring." style="width:100%;height:auto;display:block;border:0;"></td></tr></table></div><!--[if mso]></td></tr></table><![endif]--></td></tr></table></td></tr>
<tr><td style="padding:0 0 16px;"><table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#ffffff" style="border-collapse:separate;background-color:#ffffff;background-image:url(https://bharatquantumprospera.com/email/2026-11/founders01/bg-white.png);background-repeat:repeat;border:1px solid #e4e7ea;border-radius:18px;"><tr><td align="center" bgcolor="#ffffff" style="padding:24px 3% 6px;font-size:0;line-height:0;text-align:center;background-color:#ffffff;background-image:url(https://bharatquantumprospera.com/email/2026-11/founders01/bg-white.png);background-repeat:repeat;border-radius:18px;"><!--[if mso]><table role="presentation" width="1024" cellpadding="0" cellspacing="0" border="0"><tr><td width="500" valign="top"><![endif]--><div class="col" style="display:inline-block;vertical-align:top;width:100%;max-width:500px;text-align:left;"><table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#ffffff" style="border-collapse:collapse;background-color:#ffffff;background-image:url(https://bharatquantumprospera.com/email/2026-11/founders01/bg-white.png);background-repeat:repeat;"><tr><td style="font-size:0;line-height:0;"><img src="https://bharatquantumprospera.com/email/2026-11/founders01/019.png" width="442" alt="DATES TO DIARISE The founder calendar, US and India" style="width:100%;height:auto;display:block;border:0;"></td></tr><tr><td style="font-size:0;line-height:0;"><img src="https://bharatquantumprospera.com/email/2026-11/founders01/020.gif" width="442" alt="Founder dates: Delaware franchise tax by 1 March; Form 5472 with the federal return; 83(b) election within 30 days of a stock grant; FC-GPR within 30 days of allotment; ODI annual performance report by 31 December." style="width:100%;height:auto;display:block;border:0;"></td></tr><tr><td style="font-size:0;line-height:0;"><img src="https://bharatquantumprospera.com/email/2026-11/founders01/021.png" width="442" alt="" style="width:100%;heig
