India every year under CRS and FATCA. Declare before they ask." style="width:100%;height:auto;display:block;border:0;"></a></td></tr><tr><td style="font-size:0;line-height:0;"><img src="https://bharatquantumprospera.com/email/2026-11/fastds01/005.png" width="442" alt="" style="width:100%;height:auto;display:block;border:0;"></td></tr></table></div><!--[if mso]></td><td width="24"></td><td width="500" valign="top"><![endif]--><div style="display:inline-block;width:24px;height:1px;font-size:0;line-height:0;">&nbsp;</div><div class="col" style="display:inline-block;vertical-align:top;width:100%;max-width:500px;text-align:left;"><table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#ffffff" style="border-collapse:collapse;background-color:#ffffff;background-image:url(https://bharatquantumprospera.com/email/2026-11/fastds01/bg-white.png);background-repeat:repeat;"><tr><td style="font-size:0;line-height:0;"><img src="https://bharatquantumprospera.com/email/2026-11/fastds01/006.png" width="442" alt="FAST-DS 2026 SPECIAL Banks in the US, UK, UAE, Singapore and more than 100 other countries send India the details of accounts held by Indian residents, every year. This year many people found that out the hard way, when the Income Tax Department’s email about their foreign assets arrived. Until 31 December, many of these cases can be closed for a flat ₹1 lakh. After that, the same account can cost more than it’s worth, and the law allows prosecution. Ten minutes to read. Could save you lakhs." style="width:100%;height:auto;display:block;border:0;"></td></tr></table></div><!--[if mso]></td></tr></table><![endif]--></td></tr></table></td></tr>
<tr><td style="padding:0 0 16px;"><table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#ffffff" style="border-collapse:separate;background-color:#ffffff;background-image:url(https://bharatquantumprospera.com/email/2026-11/fastds01/bg-white.png);background-repeat:repeat;border:1px solid #e4e7ea;border-radius:18px;"><tr><td align="center" bgcolor="#ffffff" style="padding:24px 3% 6px;font-size:0;line-height:0;text-align:center;background-color:#ffffff;background-image:url(https://bharatquantumprospera.com/email/2026-11/fastds01/bg-white.png);background-repeat:repeat;border-radius:18px;"><!--[if mso]><table role="presentation" width="1024" cellpadding="0" cellspacing="0" border="0"><tr><td width="500" valign="top"><![endif]--><div class="col" style="display:inline-block;vertical-align:top;width:100%;max-width:500px;text-align:left;"><table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#ffffff" style="border-collapse:collapse;background-color:#ffffff;background-image:url(https://bharatquantumprospera.com/email/2026-11/fastds01/bg-white.png);background-repeat:repeat;"><tr><td style="font-size:0;line-height:0;"><img src="https://bharatquantumprospera.com/email/2026-11/fastds01/007.png" width="442" alt="IN ONE MINUTE After 31 December, a ₹1 lakh fix can become a ₹10 lakh penalty. FAST-DS, the Foreign Assets of Small Taxpayers Disclosure Scheme, 2026, is a one-time window created by the Finance Act, 2026. It lets you declare foreign assets and foreign income that never made it into your Indian return. It opened on 16 August and closes on 31 December 2026. The ₹10 lakh is the Black Money Act penalty for leaving foreign assets out of a return, where they are worth more than ₹20 lakh (excluding immovable property). It applies even if the money was taxed. Untaxed money is worse: see below." style="width:100%;height:auto;display:block;border:0;"></td></tr></table></div><!--[if mso]></td><td width="24"></td><td width="500" valign="top"><![endif]--><div style="display:inline-block;width:24px;height:1px;font-size:0;line-height:0;">&nbsp;</div><div class="col" style="display:inline-block;vertical-align:top;width:100%;max-width:500px;text-align:left;"><table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#ffffff" style="border-collapse:collapse;background-color:#ffffff;background-image:url(https://bharatquantumprospera.com/email/2026-11/fastds01/bg-white.png);background-repeat:repeat;"><tr><td style="font-size:0;line-height:0;"><img src="https://bharatquantumprospera.com/email/2026-11/fastds01/008.png" width="442" alt="" style="width:100%;height:auto;display:block;border:0;"></td></tr><tr><td style="font-size:0;line-height:0;"><img src="https://bharatquantumprospera.com/email/2026-11/fastds01/009.gif" width="442" alt="How the department knows: your bank abroad told them. Account data from the USA, UK, Canada, Australia, UAE and Singapore reaching your AIS every year under CRS and FATCA." style="width:100%;height:auto;display:block;border:0;"></td></tr><tr><td style="font-size:0;line-height:0;"><img src="https://bharatquantumprospera.com/email/2026-11/fastds01/010.png" width="442" alt="Declare an asset under the scheme and you get immunity under the Black Money Act for it: no further tax, penalty or prosecution for what you declared, and it isn’t added to your income again. That’s why the Income Tax emails are landing now. The question isn’t whether they know. It’s who speaks first." style="width:100%;height:auto;display:block;border:0;"></td></tr></table></div><!--[if mso]></td></tr></table><![endif]--></td></tr></table></td></tr>
<tr><td style="padding:0 0 16px;"><table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#ffffff" style="border-collapse:separate;background-color:#ffffff;background-image:url(https://bharatquantumprospera.com/email/2026-11/fastds01/bg-white.png);background-repeat:repeat;border:1px solid #e4e7ea;border-radius:18px;"><tr><td align="center" bgcolor="#ffffff" style="padding:24px 3% 6px;font-size:0;line-height:0;text-align:center;background-color:#ffffff;background-image:url(https://bharatquantumprospera.com/email/2026-11/fastds01/bg-white.png);background-repeat:repeat;border-radius:18px;"><!--[if mso]><table role="presentation" width="1024" cellpadding="0" cellspacing="0" border="0"><tr><td width="500" valign="top"><![endif]--><div class="col" style="display:inline-block;vertical-align:top;width:100%;max-width:500px;text-align:left;"><table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#ffffff" style="border-collapse:collapse;background-color:#ffffff;background-image:url(https://bharatquantumprospera.com/email/2026-11/fastds01/bg-white.png);background-repeat:repeat;"><tr><td style="font-size:0;line-height:0;"><img src="https://bharatquantumprospera.com/email/2026-11/fastds01/011.png" width="442" alt="IS THIS YOU? The six situations I keep seeing You moved back to India with a US 401(k) or IRA, a UK pension or ISA, a Canadian RRSP or Australian super, and it hasn’t been in Schedule FA since you became resident and ordinarily resident. You hold RSUs or ESPP shares of a foreign employer. Payroll taxed them in India, but nobody put the shares in Schedule FA. You studied or worked abroad and left a bank, brokerage or crypto account open when you came back." style="width:100%;height:auto;display:block;border:0;"></td></tr></table></div><!--[if mso]></td><td width="24"></td><td width="500" valign="top"><![endif]--><div style="display:inline-block;width:24px;height:1px;font-size:0;line-height:0;">&nbsp;</div><div class="col" style="display:inline-block;vertical-align:top;width:100%;max-width:500px;text-align:left;"><table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#ffffff" style="border-collapse:collapse;background-color:#ffffff;background-image:url(https://bharatquantumprospera.com/email/2026-11/fastds01/bg-white.png);background-repeat:repeat;"><tr><td style="font-size:0;line-height:0;"><img src="https://bharatquantumprospera.com/email/2026-11/fastds01/012.png" width="442" alt="You got the Income Tax Department’s email about foreign assets showing in your AIS. You were resident in a year but filed as a non-resident, so your foreign assets were never reported. You inherited or were gifted foreign shares, a flat or an account, and didn’t report it. Still an NRI? You can use FAST-DS too, if you were resident in India when the income arose or the asset was bought. Recognised yourself? Keep reading." style="width:100%;height:auto;display:block;border:0;"></td></tr></table></div><!--[if mso]></td></tr></table><![endif]--></td></tr></table></td></tr>
<tr><td style="padding:0 0 16px;"><table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#ffffff" style="border-collapse:separate;background-color:#ffffff;background-image:url(https://bharatquantumprospera.com/email/2026-11/fastds01/bg-white.png);background-repeat:repeat;border:1px solid #e4e7ea;border-radius:18px;"><tr><td align="center" bgcolor="#ffffff" style="padding:24px 3% 6px;font-size:0;line-height:0;text-align:center;background-color:#ffffff;background-image:url(https://bharatquantumprospera.com/email/2026-11/fastds01/bg-white.png);background-repeat:repeat;border-radius:18px;"><!--[if mso]><table role="presentation" width="1024" cellpadding="0" cellspacing="0" border="0"><tr><td width="500" valign="top"><![endif]--><div class="col" style="display:inline-block;vertical-align:top;width:100%;max-width:500px;text-align:left;"><table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#ffffff" style="border-collapse:collapse;background-color:#ffffff;background-image:url(https://bharatquantumprospera.com/email/2026-11/fastds01/bg-white.png);background-repeat:repeat;"><tr><td style="font-size:0;line-height:0;"><img src="https://bharatquantumprospera.com/email/2026-11/fastds01/013.png" width="442" alt="WHAT IT COSTS Two categories, two very different bills" style="width:100%;height:auto;display:block;border:0;"></td></tr><tr><td style="font-size:0;line-height:0;"><img src="https://bharatquantumprospera.com/email/2026-11/fastds01/014.gif" width="442" alt="Sorting assets into two bins. Category 1, 60%: dividends never taxed, a deposit with an unclear source. Category 2, INR 1 lakh: 401(k) from US salary, RSUs taxed in payroll, UK pension." style="width:100%;height:auto;display:block;border:0;"></td></tr><tr><td style="font-size:0;line-height:0;"><img src="https://bharatquantumprospera.com/email/2026-11/fastds01/015.png" width="442" alt="Category 1, 60%. Foreign income that was taxable in India but never offered to tax, or a foreign asset whose source you can’t explain. You pay 30% tax on the value plus an equal amount again: 60% in all. The total of such assets and income must be within ₹1 crore." style="width:100%;height:auto;display:block;border:0;"></td></tr></table></div><!--[if mso]></td><td width="24"></td><td width="500" valign="top"><![endif]--><div style="display:inline-block;width:24px;height:1px;font-size:0;line-height:0;">&nbsp;</div><div class="col" style="display:inline-block;vertical-align:top;width:100%;max-width:500px;text-align:left;"><table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#ffffff" style="border-collapse:collapse;background-color:#ffffff;background-image:url(https://bharatquantumprospera.com/email/2026-11/fastds01/bg-white.png);background-repeat:repeat;"><tr><td style="font-size:0;line-height:0;"><img src="https://bharatquantumprospera.com/email/2026-11/fastds01/016.png" width="442" alt="Category 2, a flat ₹1 lakh. A foreign asset bought from money earned abroad while you were a non-resident, or from income already taxed in India, that simply wasn’t shown in Schedule FA. One fee of ₹1 lakh, for an asset worth up to ₹5 crore. Assets are valued at fair market value on 31 March 2026. The Department’s own example: a ₹60 lakh undisclosed foreign account plus ₹20 lakh of income from it makes ₹80 lakh, and 60% of that is ₹48 lakh. Most of the people who write to me are Category 2: a 401(k) or RSUs that were properly taxed but never listed. That’s the ₹1 lakh case, not the 60% one." style="width:100%;height:auto;display:block;border:0;"></td></tr><tr><td style="font-size:0;line-height:0;"><table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="table-layout:fixed;border-collapse:collapse;"><tr><td width="83.937%" valign="top" style="width:83.937%;font-size:0;line-height:0;"><a href="https://bharatquantumprospera.com/fast-ds-2026-calculator-foreign-asset-disclosure-cost.html?utm_source=newsletter&amp;utm_medium=email&amp;utm_campaign=bqp_fastds_01&amp;utm_content=calc_inline" target="_blank" style="display:block;"><img src="https://bharatquantumprospera.com/email/2026-11/fastds01/017.png" width="371" alt="Work out your amount on the FAST-DS calculator →" style="width:100%;height:auto;display:block;border:0;"></a></td><td width="16.063%" valign="top" style="width:16.063%;font-size:0;line-height:0;"><img src="https://bharatquantumprospera.com/email/2026-11/fastds01/018.png" width="71" alt="" style="width:100%;height:auto;display:block;border:0;"></td></tr></table></td></tr><tr><td style="font-size:0;line-height:0;"><img src="https://bharatquantumprospera.com/email/2026-11/fastds01/019.png" width="442" alt="" style="width:100%;height:auto;display:block;border:0;"></td></tr></table></div><!--[if mso]></td></tr></table><![endif]--></td></tr></table></td></tr>
<tr><td style="padding:0 0 16px;"><table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#ffffff" style="border-collapse:separate;background-color:#ffffff;background-image:url(https://bharatquantumprospera.com/email/2026-11/fastds01/bg-white.png);background-repeat:repeat;border:1px solid #e4e7ea;border-radius:18px;"><tr><td align="center" bgcolor="#ffffff" style="padding:24px 3% 6px;font-size:0;line-height:0;text-align:center;background-color:#ffffff;background-image:url(https://bharatquantumprospera.com/email/2026-11/fastds01/bg-white.png);background-repeat:repeat;border-radius:18px;"><!--[if mso]><table role="presentation" width="1024" cellpadding="0" cellspacing="0" border="0"><tr><td width="500" valign="top"><![endif]--><div class="col" style="display:inline-block;vertical-align:top;width:100%;max-width:500px;text-align:left;"><table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#ffffff" style="border-collapse:collapse;background-color:#ffffff;background-image:url(https://bharatquantumprospera.com/email/2026-11/fastds01/bg-white.png);background-repeat:repeat;"><tr><td style="font-size:0;line-height:0;"><img src="https://bharatquantumprospera.com/email/2026-11/fastds01/020.png" width="442" alt="IF YOU LET IT PASS What happens if you don’t declare After 31 December the window shuts, and anything undisclosed that comes to light later is dealt with under the Black Money Act, 2015. Same ₹80 lakh example:" style="width:100%;height:auto;display:block;border:0;"></td></tr><tr><td style="font-size:0;line-height:0;"><img src="https://bharatquantumprospera.com/email/2026-11/fastds01/021.gif" width="442" alt="Same money, twice the bill. On 80 lakh rupees: declare now and pay 48 lakh. Found later: 30% tax of 24 lakh plus a penalty of three times the tax, 72 lakh, plus prosecution." style="width:100%;height:auto;display:block;border:0;"></td></tr><tr><td style="font-size:0;line-height:0;"><img src="https://bharatquantumprospera.com/email/2026-11/fastds01/022.png" width="442" alt="" style="width:100%;height:auto;display:block;border:0;"></td></tr></table></div><!--[if mso]></td><td width="24"></td><td width="500" valign="top"><![endif]--><div style="display:inline-block;width:24px;height:1px;font-size:0;line-height:0;">&nbsp;</div><div class="col" style="display:inline-block;vertical-align:top;width:100%;max-width:500px;text-align:left;"><table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#ffffff" style="border-collapse:collapse;background-color:#ffffff;background-image:url(https://bharatquantumprospera.com/email/2026-11/fastds01/bg-white.png);background-repeat:repeat;"><tr><td style="font-size:0;line-height:0;"><img src="https://bharatquantumprospera.com/email/2026-11/fastds01/023.png" width="442" alt="30% tax on the undisclosed foreign income or the value of the asset. A penalty of three times that tax, which takes the total to 120% of the value. ₹10 lakh penalty for not showing foreign assets in your return, even when the money itself was taxed. It applies where foreign assets other than immovable property are worth more than ₹20 lakh. Prosecution. Wilfully leaving foreign assets out of a return can mean imprisonment of six months to seven years. The data is already with them, through bank-to-bank reporting from abroad. The only question is who brings it up first." style="width:100%;height:auto;display:block;border:0;"></td></tr><tr><td style="font-size:0;line-height:0;"><img src="https://bharatquantumprospera.com/email/2026-11/fastds01/024.png" width="442" alt="" style="width:100%;height:auto;display:block;border:0;"></td></tr></table></div><!--[if mso]></td></tr></table><![endif]--></td></tr></table></td></tr>

rong, give feedback on the portal. Don’t file FAST-DS just to be safe." style="width:100%;height:auto;display:block;border:0;"></td></tr></table></div><!--[if mso]></td><td width="24"></td><td width="500" valign="top"><![endif]--><div style="display:inline-block;width:24px;height:1px;font-size:0;line-height:0;">&nbsp;</div><div class="col" style="display:inline-block;vertical-align:top;width:100%;max-width:500px;text-align:left;"><table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#ffffff" style="border-collapse:collapse;background-color:#ffffff;background-image:url(https://bharatquantumprospera.com/email/2026-11/fastds01/bg-white.png);background-repeat:repeat;"><tr><td style="font-size:0;line-height:0;"><img src="https://bharatquantumprospera.com/email/2026-11/fastds01/027.png" width="442" alt="Don’t over-declare. Already reported it? Do nothing. Only FY 2025-26 missed? A revised return may be enough. An asset from taxed money is Category 2, not Category 1. Get your 31 March 2026 statements now. Foreign banks and plan administrators can take weeks to send them. Don’t leave it to Christmas week. The portal slows down in the last days, and a declaration can’t be fixed after the window shuts. Then fix Schedule FA for good. Immunity covers what you declare, up to 2025-26. From 2026-27 the assets have to be in your return every year." style="width:100%;height:auto;display:block;border:0;"></td></tr></table></div><!--[if mso]></td></tr></table><![endif]--></td></tr></table></td></tr>
