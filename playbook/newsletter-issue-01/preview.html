<tr><td style="padding:0 0 16px;"><table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#ffffff" style="border-collapse:separate;background-color:#ffffff;background-image:url(../../email/2026-11/diwali07/bg-white.png);background-repeat:repeat;border:1px solid #e4e7ea;border-radius:18px;"><tr><td align="center" bgcolor="#ffffff" style="padding:24px 3% 6px;font-size:0;line-height:0;text-align:center;background-color:#ffffff;background-image:url(../../email/2026-11/diwali07/bg-white.png);background-repeat:repeat;border-radius:18px;"><!--[if mso]><table role="presentation" width="1024" cellpadding="0" cellspacing="0" border="0"><tr><td width="500" valign="top"><![endif]--><div class="col" style="display:inline-block;vertical-align:top;width:100%;max-width:500px;text-align:left;"><table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#ffffff" style="border-collapse:collapse;background-color:#ffffff;background-image:url(../../email/2026-11/diwali07/bg-white.png);background-repeat:repeat;"><tr><td style="font-size:0;line-height:0;"><img src="../../email/2026-11/diwali07/003.png" width="442" alt="DIWALI" style="width:100%;height:auto;display:block;border:0;"></td></tr><tr><td style="font-size:0;line-height:0;"><img src="../../email/2026-11/diwali07/004.gif" width="442" alt="Happy Diwali. Fireworks over a row of lit diyas. Shubh Deepavali, Samvat 2083." style="width:100%;height:auto;display:block;border:0;"></td></tr><tr><td style="font-size:0;line-height:0;"><img src="../../email/2026-11/diwali07/005.png" width="442" alt="" style="width:100%;height:auto;display:block;border:0;"></td></tr></table></div><!--[if mso]></td><td width="24"></td><td width="500" valign="top"><![endif]--><div style="display:inline-block;width:24px;height:1px;font-size:0;line-height:0;">&nbsp;</div><div class="col" style="display:inline-block;vertical-align:top;width:100%;max-width:500px;text-align:left;"><table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#ffffff" style="border-collapse:collapse;background-color:#ffffff;background-image:url(../../email/2026-11/diwali07/bg-white.png);background-repeat:repeat;"><tr><td style="font-size:0;line-height:0;"><img src="../../email/2026-11/diwali07/006.png" width="442" alt="Namaste, and a very happy Diwali to you and your family from all of us at BQP. Dhanteras is on Friday and Lakshmi Puja on Sunday, so I’ll try to keep the money talk short this time. I said try. Shubh Deepavali!" style="width:100%;height:auto;display:block;border:0;"></td></tr></table></div><!--[if mso]></td></tr></table><![endif]--></td></tr></table></td></tr>
<tr><td style="padding:0 0 16px;"><table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#ffffff" style="border-collapse:separate;background-color:#ffffff;background-image:url(../../email/2026-11/diwali07/bg-white.png);background-repeat:repeat;border:1px solid #e4e7ea;border-radius:18px;"><tr><td align="center" bgcolor="#ffffff" style="padding:24px 3% 6px;font-size:0;line-height:0;text-align:center;background-color:#ffffff;background-image:url(../../email/2026-11/diwali07/bg-white.png);background-repeat:repeat;border-radius:18px;"><!--[if mso]><table role="presentation" width="1024" cellpadding="0" cellspacing="0" border="0"><tr><td width="500" valign="top"><![endif]--><div class="col" style="display:inline-block;vertical-align:top;width:100%;max-width:500px;text-align:left;"><table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#ffffff" style="border-collapse:collapse;background-color:#ffffff;background-image:url(../../email/2026-11/diwali07/bg-white.png);background-repeat:repeat;"><tr><td style="font-size:0;line-height:0;"><img src="../../email/2026-11/diwali07/007.png" width="442" alt="THIS WEEK America changed its mind overnight. Your home loan didn’t. On Tuesday, Americans voted the Democrats into control of the House, and by most counts the Senate too. Wall Street liked it. On Wednesday the Dow jumped about 1,500 points, its best day this year, and oil prices fell." style="width:100%;height:auto;display:block;border:0;"></td></tr></table></div><!--[if mso]></td><td width="24"></td><td width="500" valign="top"><![endif]--><div style="display:inline-block;width:24px;height:1px;font-size:0;line-height:0;">&nbsp;</div><div class="col" style="display:inline-block;vertical-align:top;width:100%;max-width:500px;text-align:left;"><table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#ffffff" style="border-collapse:collapse;background-color:#ffffff;background-image:url(../../email/2026-11/diwali07/bg-white.png);background-repeat:repeat;"><tr><td style="font-size:0;line-height:0;"><img src="../../email/2026-11/diwali07/008.png" width="442" alt="" style="width:100%;height:auto;display:block;border:0;"></td></tr><tr><td style="font-size:0;line-height:0;"><img src="../../email/2026-11/diwali07/009.gif" width="442" alt="This week: US Congress changed hands. Dow up about 1,500 points. Oil falling. RBI repo rate up to 5.50%. Your EMI: still up." style="width:100%;height:auto;display:block;border:0;"></td></tr><tr><td style="font-size:0;line-height:0;"><img src="../../email/2026-11/diwali07/010.png" width="442" alt="Back home, your home loan is still carrying October’s rate hike. There’s a fair chance your bank handled that by quietly adding months to your loan rather than raising your EMI. I’ll show you what that costs further down, because it’s the one thing in this email I’d really like you to check this week. Funny how we don’t get a vote in America but somehow still get the bill." style="width:100%;height:auto;display:block;border:0;"></td></tr></table></div><!--[if mso]></td></tr></table><![endif]--></td></tr></table></td></tr>
<tr><td style="padding:0 0 16px;"><table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#ffffff" style="border-collapse:separate;background-color:#ffffff;background-image:url(../../email/2026-11/diwali07/bg-white.png);background-repeat:repeat;border:1px solid #e4e7ea;border-radius:18px;"><tr><td align="center" bgcolor="#ffffff" style="padding:24px 3% 6px;font-size:0;line-height:0;text-align:center;background-color:#ffffff;background-image:url(../../email/2026-11/diwali07/bg-white.png);background-repeat:repeat;border-radius:18px;"><!--[if mso]><table role="presentation" width="1024" cellpadding="0" cellspacing="0" border="0"><tr><td width="500" valign="top"><![endif]--><div class="col" style="display:inline-block;vertical-align:top;width:100%;max-width:500px;text-align:left;"><table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#ffffff" style="border-collapse:collapse;background-color:#ffffff;background-image:url(../../email/2026-11/diwali07/bg-white.png);background-repeat:repeat;"><tr><td style="font-size:0;line-height:0;"><img src="../../email/2026-11/diwali07/011.png" width="442" alt="THE WORLD How a vote in Washington ends up in your EMI I usually explain this one with dominoes. It isn’t a perfect picture, but it’s close enough." style="width:100%;height:auto;display:block;border:0;"></td></tr><tr><td style="font-size:0;line-height:0;"><img src="../../email/2026-11/diwali07/012.gif" width="442" alt="Five dominoes falling: US vote, oil, rupee, RBI meeting 2 to 4 December, your EMI." style="width:100%;height:auto;display:block;border:0;"></td></tr><tr><td style="font-size:0;line-height:0;"><img src="../../email/2026-11/diwali07/013.png" width="442" alt="It starts with oil. The war with Iran pushed crude above $100 a barrel this year, and India imports most of the oil it uses. Costlier oil means we need more dollars, and the rupee weakens. On 16 October it closed at 94.92 to the dollar, and that was with the RBI selling and swapping an estimated $75–80 billion since June to hold it up." style="width:100%;height:auto;display:block;border:0;"></td></tr></table></div><!--[if mso]></td><td width="24"></td><td width="500" valign="top"><![endif]--><div style="display:inline-block;width:24px;height:1px;font-size:0;line-height:0;">&nbsp;</div><div class="col" style="display:inline-block;vertical-align:top;width:100%;max-width:500px;text-align:left;"><table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#ffffff" style="border-collapse:collapse;background-color:#ffffff;background-image:url(../../email/2026-11/diwali07/bg-white.png);background-repeat:repeat;"><tr><td style="font-size:0;line-height:0;"><img src="../../email/2026-11/diwali07/014.png" width="442" alt="A weaker rupee pushes prices up, and prices are what the RBI watches most closely. In October it raised the repo rate to 5.50%, its first increase since February 2023. Your bank’s home-loan rate is linked to that number. This week oil went the other way after the US vote, partly on hopes of calmer talks in the Middle East. The next date I’m watching is the RBI meeting on 2–4 December. If oil stays down until then, another hike looks less likely. If it climbs back, I wouldn’t rule one out. If you export to the US: the India–US trade deal announced in February still hasn’t been signed, and US tariff rules have changed more than once since. Leave some room in your price quotes." style="width:100%;height:auto;display:block;border:0;"></td></tr></table></div><!--[if mso]></td></tr></table><![endif]--></td></tr></table></td></tr>
<tr><td style="padding:0 0 16px;"><table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#ffffff" style="border-collapse:separate;background-color:#ffffff;background-image:url(../../email/2026-11/diwali07/bg-white.png);background-repeat:repeat;border:1px solid #e4e7ea;border-radius:18px;"><tr><td align="center" bgcolor="#ffffff" style="padding:24px 3% 6px;font-size:0;line-height:0;text-align:center;background-color:#ffffff;background-image:url(../../email/2026-11/diwali07/bg-white.png);background-repeat:repeat;border-radius:18px;"><!--[if mso]><table role="presentation" width="1024" cellpadding="0" cellspacing="0" border="0"><tr><td width="500" valign="top"><![endif]--><div class="col" style="display:inline-block;vertical-align:top;width:100%;max-width:500px;text-align:left;"><table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#ffffff" style="border-collapse:collapse;background-color:#ffffff;background-image:url(../../email/2026-11/diwali07/bg-white.png);background-repeat:repeat;"><tr><td style="font-size:0;line-height:0;"><img src="../../email/2026-11/diwali07/015.png" width="442" alt="YOUR HOME LOAN Has your bank quietly added a year to your loan? When the repo rate goes up, a bank can pass it on in two ways. It can raise your EMI, or it can keep the EMI where it is and make the loan longer. Many banks do the second by default. Nobody phones the bank to complain about an EMI that hasn’t changed. Here’s the difference on a ₹50 lakh, 20-year home loan at 8.5%, after a 0.25% hike:" style="width:100%;height:auto;display:block;border:0;"></td></tr><tr><td style="font-size:0;line-height:0;"><img src="../../email/2026-11/diwali07/016.gif" width="442" alt="Option A: EMI up 794 rupees a month, 1.9 lakh more interest. Option B: EMI same, loan grows to 252 months, 5.4 lakh more interest." style="width:100%;height:auto;display:block;border:0;"></td></tr><tr><td style="font-size:0;line-height:0;"><img src="../../email/2026-11/diwali07/017.png" width="442" alt="" style="width:100%;height:auto;display:block;border:0;"></td></tr></table></div><!--[if mso]></td><td width="24"></td><td width="500" valign="top"><![endif]--><div style="display:inline-block;width:24px;height:1px;font-size:0;line-height:0;">&nbsp;</div><div class="col" style="display:inline-block;vertical-align:top;width:100%;max-width:500px;text-align:left;"><table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#ffffff" style="border-collapse:collapse;background-color:#ffffff;background-image:url(../../email/2026-11/diwali07/bg-white.png);background-repeat:repeat;"><tr><td style="font-size:0;line-height:0;"><img src="../../email/2026-11/diwali07/018.png" width="442" alt="Same hike, but the longer loan costs you about ₹3.5 lakh more in interest. So please pull out your latest loan statement and look at how many months are left. If that number has gone up, ask the bank to raise your EMI instead. Most banks will do it on a written request. The example assumes the full 0.25% is passed on from month one and the rate stays at 8.75% after that. Your own numbers will be different, but the gap will be there. Sending money from the US? The 1% US remittance tax that started on 1 January only applies when you pay in cash, by money order or by cashier’s cheque. Pay from a US bank account or card and you won’t be charged it." style="width:100%;height:auto;display:block;border:0;"></td></tr></table></div><!--[if mso]></td></tr></table><![endif]--></td></tr></table></td></tr>
<tr><td style="padding:0 0 16px;"><table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#ffffff" style="border-collapse:separate;background-color:#ffffff;background-image:url(../../email/2026-11/diwali07/bg-white.png);background-repeat:repeat;border:1px solid #e4e7ea;border-radius:18px;"><tr><td align="center" bgcolor="#ffffff" style="padding:24px 3% 6px;font-size:0;line-height:0;text-align:center;background-color:#ffffff;background-image:url(../../email/2026-11/diwali07/bg-white.png);background-repeat:repeat;border-radius:18px;"><!--[if mso]><table role="presentation" width="1024" cellpadding="0" cellspacing="0" border="0"><tr><td width="500" valign="top"><![endif]--><div class="col" style="display:inline-block;vertical-align:top;width:100%;max-width:500px;text-align:left;"><table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#ffffff" style="border-collapse:collapse;background-color:#ffffff;background-image:url(../../email/2026-11/diwali07/bg-white.png);background-repeat:repeat;"><tr><td style="font-size:0;line-height:0;"><img src="../../email/2026-11/diwali07/019.png" width="442" alt="DIWALI MONEY A few Diwali money things, before Sunday" style="width:100%;height:auto;display:block;border:0;"></td></tr><tr><td style="font-size:0;line-height:0;"><img src="../../email/2026-11/diwali07/020.gif" width="442" alt="Five diyas lighting one by one: gold, bonus, gifts, money home, Muhurat trading." style="width:100%;height:auto;display:block;border:0;"></td></tr><tr><td style="font-size:0;line-height:0;"><img src="../../email/2026-11/diwali07/021.png" width="442" alt="Buying gold on Dhanteras? With jewellery, a good part of what you pay is the making charge, and you don’t get that back when you sell. If the gold is for saving rather than wearing, coins or bars usually make more sense. For jewellery, look for the BIS hallmark and its 6-digit HUID code." style="width:100%;height:auto;display:block;border:0;"></td></tr></table></div><!--[if mso]></td><td width="24"></td><td width="500" valign="top"><![endif]--><div style="display:inline-block;width:24px;height:1px;font-size:0;line-height:0;">&nbsp;</div><div class="col" style="display:inline-block;vertical-align:top;width:100%;max-width:500px;text-align:left;"><table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#ffffff" style="border-collapse:collapse;background-color:#ffffff;background-image:url(../../email/2026-11/diwali07/bg-white.png);background-repeat:repeat;"><tr><td style="font-size:0;line-height:0;"><img src="../../email/2026-11/diwali07/022.png" width="442" alt="The Diwali bonus. Decide what it’s for before it reaches your account, even if the answer is “a new phone”. Money without a plan has a way of disappearing by Bhai Dooj. Cash gifts. Anything from relatives is tax-free, however much it is. From friends, gifts are tax-free only until the year’s total crosses ₹50,000. After that, the whole amount is taxed as your income. Mithai doesn’t count, so relax. Sending money home from the US? Send it from your bank account or card and the 1% US remittance tax won’t apply. Your parents don’t pay any tax in India on money you send them." style="width:100%;height:auto;display:block;border:0;"></td></tr><tr><td style="font-size:0;line-height:0;"><img src="../../email/2026-11/diwali07/023.png" width="442" alt="Muhurat trading is on Sunday evening. NSE will announce the exact hour. Buying a share or two for luck is a lovely tradition. Just don’t make a big decision because the hour is auspicious. Markets are closed again on Tuesday, 10 November. Happy shopping. And keep the bills!" style="width:100%;height:auto;display:block;border:0;"></td></tr></table></div><!--[if mso]></td></tr></table><![endif]--></td></tr></table></td></tr>
<tr><td style="padding:0 0 16px;"><table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#ffffff" style="border-collapse:separate;background-color:#ffffff;background-image:url(../../email/2026-11/diwali07/bg-white.png);background-repeat:repeat;border:1px solid #e4e7ea;border-radius:18px;"><tr><td align="center" bgcolor="#ffffff" style="padding:24px 3% 6px;font-size:0;line-height:0;text-align:center;background-color:#ffffff;background-image:url(../../email/2026-11/diwali07/bg-white.png);background-repeat:repeat;border-radius:18px;"><!--[if mso]><table role="presentation" width="1024" cellpadding="0" cellspacing="0" border="0"><tr><td width="500" valign="top"><![endif]--><div class="col" style="display:inline-block;vertical-align:top;width:100%;max-width:500px;text-align:left;"><table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#ffffff" style="border-collapse:collapse;background-color:#ffffff;background-image:url(../../email/2026-11/diwali07/bg-white.png);background-repeat:repeat;"><tr><td style="font-size:0;line-height:0;"><img src="../../email/2026-11/diwali07/024.png" width="442" alt="MONEY HABITS Three things I keep telling people Save in the currency you’ll spend in. If your child’s college fees will be paid in dollars, saving for them in rupees is a bet on the rupee, whether you meant to make one or not. A year ago a dollar cost about ₹89.5. In October it was nearly ₹95. That’s about 6% more for the same fees, before you’ve earned a rupee of interest." style="width:100%;height:auto;display:block;border:0;"></td></tr></table></div><!--[if mso]></td><td width="24"></td><td width="500" valign="top"><![endif]--><div style="display:inline-block;width:24px;height:1px;font-size:0;line-height:0;">&nbsp;</div><div class="col" style="display:inline-block;vertical-align:top;width:100%;max-width:500px;text-align:left;"><table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#ffffff" style="border-collapse:collapse;background-color:#ffffff;background-image:url(../../email/2026-11/diwali07/bg-white.png);background-repeat:repeat;"><tr><td style="font-size:0;line-height:0;"><img src="../../email/2026-11/diwali07/025.png" width="442" alt="After big news, wait a couple of days. The Dow had its best day of the year this week, and Jio listed about 21% above its issue price last week. Days like these make everyone want to do something with their money. Give it 48 hours. If you still want to do it after that, fine. Check your FD rates. When the RBI raises rates, banks usually raise deposit rates too, a little later. If yours has, and your spare money is still in a savings account, it may be time to move some of it. And do forward this to that one uncle who checks the Sensex at weddings." style="width:100%;height:auto;display:block;border:0;"></td></tr></table></div><!--[if mso]></td></tr></table><![endif]--></td></tr></table></td></tr>
